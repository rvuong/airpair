name: Deploy — Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/pongbros-repo

            # Ensure remote points to the current repo name
            git remote set-url origin https://github.com/rvuong/airpair.git

            # Discard any local changes and pull latest code
            git fetch origin
            git reset --hard origin/main

            # Host hardening first: frees memory and adds swap before npm/tsc (D11)
            sudo PM2_BIN="$(command -v pm2)" bash scripts/server/harden.sh

            # Install deps + compile
            cd server
            npm ci --omit=dev
            npm install --save-dev typescript @types/node @types/ws
            npx tsc

            # (Re)start from the ecosystem file so pm2 options (memory cap) always apply.
            # ~1 s of downtime per deploy, accepted: deploys are rare and rooms are short-lived.
            pm2 delete airpair-server >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs
            pm2 save
