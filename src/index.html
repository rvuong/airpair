<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AirPair</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080818" />
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);

        /* Design tokens — cf. docs/ux-charte-principes.md §3 */
        --bg-primary: #080818;
        --accent-role-a: #ff2d78;         /* hôte — identique au Canvas de jeu (D22) */
        --accent-role-b: #00d4e8;         /* invité — identique au Canvas de jeu */
        --accent-yellow-action: #ffe44d;  /* action neutre : « prêt », countdown, revanche */
        --accent-green-success: #39ff14;  /* succès uniquement */
        --text-secondary: #9aa0b0;        /* gris moyen — contraste à revérifier WCAG sur bg (D21) */

        /* Tailles typographiques — charte §3.3, rem relatifs à la racine clamp() */
        --font-size-display: 2.25rem;         /* 36px @ 390px */
        --font-size-cta: 1rem;                /* 16px @ 390px */
        --font-size-body: 1.125rem;           /* 18px @ 390px */
        --font-size-secondary: 0.875rem;      /* 14px @ 390px */
        --font-size-status-success: 0.875rem; /* 14px @ 390px */
        --font-size-link: 0.875rem;           /* 14px @ 390px */

        --radius-btn: 12px;
        --radius-panel-bottom: 8px;
        --frame-margin: 24px;
        --frame-content-width: 342px;
        --landing-cap-height: 64px; /* hauteur miroir header (logo) / footer */
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        /* base ~16px @ 390px de large, bornée pour rester lisible partout —
           charte §2.8 ; tous les text-* ci-dessous sont exprimés en rem */
        font-size: clamp(14px, 4.1vw, 19px);
      }

      html, body {
        height: 100%;
        background: var(--bg-primary);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }

      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        overflow-y: hidden;
        padding: env(safe-area-inset-top, 16px) 24px env(safe-area-inset-bottom, 24px);
      }

      /* Portrait-only landscape warning */
      #landscape-warning {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: var(--bg-primary);
        color: #fff;
        font-size: 1.25rem;
        font-weight: 600;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        gap: 16px;
      }

      @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
        #landscape-warning {
          display: flex;
        }
      }

      /* Buttons */
      .btn {
        display: block;
        width: 100%;
        max-width: var(--frame-content-width);
        min-height: 3em;
        padding: 0.75em 1.33em;
        border: none;
        border-radius: var(--radius-btn);
        font-size: var(--font-size-cta);
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.15s ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .btn:active {
        opacity: 0.75;
      }

      .btn-primary {
        background: #f5f5f5;
        color: #111;
      }

      .btn-secondary {
        background: #2a2a2a;
        color: #fff;
        border: 1px solid #444;
      }

      /* CTA neutre outline (charte §1.3 : aucune couleur de rôle avant attribution) */
      .btn-outline {
        background: transparent;
        color: #fff;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
      }

      .btn-tab {
        flex: 1;
        min-height: 2.5em;
        padding: 0.5em 0.85em;
        border: none;
        border-radius: 8px;
        font-size: var(--font-size-cta);
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        background: transparent;
        color: #aaa;
      }

      .btn-tab.active {
        background: #2a2a2a;
        color: #fff;
      }

      /* Input */
      .input-text {
        display: block;
        width: 100%;
        max-width: var(--frame-content-width);
        min-height: 56px;
        padding: 14px 16px;
        border: 1px solid #444;
        border-radius: var(--radius-btn);
        background: #1a1a1a;
        color: #fff;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-align: center;
        text-transform: uppercase;
        outline: none;
        -webkit-appearance: none;
      }

      .input-text:focus {
        border-color: #888;
      }

      .input-text::placeholder {
        color: #555;
        letter-spacing: 0.1em;
      }

      /* Layout helpers */
      .screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        flex: 1;
        min-height: 0;
        gap: 20px;
        padding-top: 48px;
        padding-bottom: 24px;
        touch-action: pan-y;
        overflow-y: auto;
      }

      .screen-title {
        font-size: var(--font-size-display);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }

      .screen-subtitle {
        font-size: var(--font-size-secondary);
        line-height: 1.5;
        color: var(--text-secondary);
        text-align: center;
        max-width: 280px;
      }

      .status-msg {
        font-size: var(--font-size-body);
        color: var(--text-secondary);
        text-align: center;
      }

      .status-msg.success {
        color: var(--accent-green-success);
        font-weight: 600;
      }

      .status-msg.error {
        color: #f87171;
      }

      /* QR code container */
      .qr-wrapper {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .room-code {
        font-size: var(--font-size-display);
        font-weight: 800;
        letter-spacing: 0.2em;
        font-variant-numeric: tabular-nums;
      }

      /* Tab bar for join screen */
      .tab-bar {
        display: flex;
        width: 100%;
        max-width: var(--frame-content-width);
        background: #1a1a1a;
        border-radius: 10px;
        padding: 4px;
        gap: 4px;
      }

      /* Video scanner */
      .video-container {
        position: relative;
        width: 100%;
        max-width: var(--frame-content-width);
        border-radius: var(--radius-btn);
        overflow: hidden;
        background: #000;
        aspect-ratio: 1;
      }

      .video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .scan-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .scan-reticle {
        width: 60%;
        height: 60%;
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
      }

      /* Back button */
      .btn-back {
        align-self: flex-start;
        background: none;
        border: none;
        color: var(--text-secondary);
        font-size: var(--font-size-body);
        cursor: pointer;
        padding: 8px 0;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      .btn-back:active {
        color: #fff;
      }

      /* Countdown screen */
      .screen-countdown {
        justify-content: center;
      }

      .countdown-number {
        font-size: 9rem;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -0.02em;
        transition: color 0.15s ease;
      }

      .countdown-number.go {
        font-size: 4rem;
        color: var(--accent-green-success);
        letter-spacing: 0.15em;
      }

      /* Logo */
      .logo {
        width: 100%;
        max-width: 240px;
        height: auto;
        display: block;
      }

      /* Landing — en-tête en haut, groupe de CTA centré verticalement */
      .screen-landing {
        justify-content: flex-start;
        gap: 0;
        padding-top: 16px;
        padding-bottom: 16px;
      }

      /* Header : logo seul, hauteur fixe */
      .landing-header {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        height: var(--landing-cap-height);
        margin-top: 24px;
      }

      /* Corps : zone centrale entre header et footer. Les CTA y sont centrés
         verticalement ; la tagline est en position absolue pour ne pas décaler
         ce centrage. */
      .landing-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        min-height: 0;
      }

      .landing-tagline {
        flex: none;
        margin-top: 24px;
        font-size: calc(var(--font-size-secondary) * 2);
        line-height: 1.6;
        color: var(--text-secondary);
        text-align: center;
      }

      /* Centre le bloc CTA dans l'espace restant SOUS la tagline (dans le flux) :
         évite tout chevauchement sur écran court (iPhone SE) */
      .landing-cta-center {
        flex: 1;
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 0;
      }

      .landing-cta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        width: 100%;
      }

      /* Footer : miroir du header (même hauteur) → zone centrale centrée à l'écran */
      .landing-footer {
        flex: none;
        height: var(--landing-cap-height);
        margin-bottom: 24px;
      }

      .cta-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
      }

      .screen-landing .btn-outline {
        font-size: var(--font-size-body);
        font-weight: 700;
        letter-spacing: 0.04em;
        min-height: 3.4em;
      }

      .cta-caption {
        font-size: var(--font-size-secondary);
        color: var(--text-secondary);
        text-align: center;
      }

      @keyframes pulse-in {
        from { transform: scale(1.4); opacity: 0.6; }
        to   { transform: scale(1);   opacity: 1; }
      }

      .countdown-number.pulse {
        animation: pulse-in 0.25s ease-out forwards;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="landscape-warning" aria-live="polite">
      <span style="font-size: 2.5rem">&#8635;</span>
      <span>Tournez votre téléphone</span>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
